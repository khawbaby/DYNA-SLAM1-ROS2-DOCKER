version: "3.8"

x-dyna-slam1-common: &dyna-slam1_common
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY
      - TERM
      - QT_X11_NO_MITSHM=1
    # entrypoint: ["/bin/bash"]

services:
